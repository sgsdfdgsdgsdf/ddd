<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fortnite Motion Video</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage" id="stage">

    <!-- CENA 1: LOGO -->
    <section class="scene scene-logo" data-scene="0">
      <div class="bg-grid"></div>
      <div class="logo-wrap">
        <h1 class="logo-text">
          <span>F</span><span>O</span><span>R</span><span>T</span><span>N</span><span>I</span><span>T</span><span>E</span>
        </h1>
        <p class="tagline">BATTLE ROYALE</p>
      </div>
      <div class="rays"></div>
    </section>

    <!-- CENA 2: ÔNIBUS DE BATALHA -->
    <section class="scene scene-bus" data-scene="1">
      <div class="sky"></div>
      <div class="clouds">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>
      </div>
      <div class="island"></div>
      <div class="battle-bus">
        <div class="balloon"></div>
        <div class="ropes"></div>
        <div class="bus">
          <div class="bus-window"></div>
          <div class="bus-window"></div>
          <div class="bus-window"></div>
          <div class="bus-wheel left"></div>
          <div class="bus-wheel right"></div>
        </div>
      </div>
      <h2 class="scene-title">O ÔNIBUS DE BATALHA</h2>
    </section>

    <!-- CENA 3: PARAQUEDISMO -->
    <section class="scene scene-skydive" data-scene="2">
      <div class="sky-deep"></div>
      <div class="wind-lines">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="skydiver">
        <div class="glider"></div>
        <div class="character"></div>
      </div>
      <h2 class="scene-title">SALTANDO!</h2>
    </section>

    <!-- CENA 4: TEMPESTADE -->
    <section class="scene scene-storm" data-scene="3">
      <div class="storm-bg"></div>
      <div class="storm-circle"></div>
      <div class="lightning"></div>
      <div class="rain">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h2 class="scene-title storm-title">CUIDADO COM A TEMPESTADE!</h2>
    </section>

    <!-- CENA 5: CONSTRUÇÃO -->
    <section class="scene scene-build" data-scene="4">
      <div class="ground"></div>
      <div class="grid-3d"></div>
      <div class="build-wall w1"></div>
      <div class="build-wall w2"></div>
      <div class="build-wall w3"></div>
      <div class="build-wall w4"></div>
      <div class="build-roof"></div>
      <h2 class="scene-title">CONSTRUA SUA FORTALEZA!</h2>
    </section>

    <!-- CENA 6: VICTORY ROYALE -->
    <section class="scene scene-victory" data-scene="5">
      <div class="victory-bg"></div>
      <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="trophy">
        <div class="trophy-cup"></div>
        <div class="trophy-base"></div>
      </div>
      <h1 class="victory-text">
        <span class="line1">VICTORY</span>
        <span class="line2">ROYALE</span>
      </h1>
      <p class="victory-sub">#1</p>
    </section>

  </div>

  <!-- CONTROLES -->
  <div class="controls">
    <button id="playBtn">▶ REPLAY</button>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <span class="timer" id="timer">0.0s / 24.0s</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
